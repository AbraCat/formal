[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "formal"
version = "0.1.0"
description = "Библиотека для работы с регулярными выражениями и конечными автоматами"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fire>=0.6.0",
    "graphviz>=0.20.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
formal = "formal.cli:main"

[tool.pytest.ini_options]
addopts = "--cov=formal --cov-report=term-missing"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["formal*"]
